<div id="nm-directions"></div>

<style>
:root{
  --nm-accent:#c0e800;
  --nm-arrow-bg:#c0e800;
  --nm-arrow-color:black;
  --nm-arrow-disabled:rgba(255,255,255,.22);
}

#nm-directions{ width:100%; background:#101010; color:#fff; font-family:"DrukTextWideTT", Arial, sans-serif; overflow:hidden; }
.nm-wrap{ max-width:100%; margin:auto; padding:30px 24px 40px; box-sizing:border-box; }
.nm-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:20px; margin-bottom:28px; }
.nm-title{ font-weight:900; font-size:34px; line-height:.9; letter-spacing:-0.05em; text-transform:uppercase; margin:0; }

.nm-nav{ display:none; align-items:center; gap:8px; flex:0 0 auto; padding-top:2px; }
.nm-nav.is-visible{ display:flex; }
.nm-nav-btn{ width:30px; height:30px; border:none; border-radius:999px; background:var(--nm-arrow-bg); color:var(--nm-arrow-color); display:inline-flex; align-items:center; justify-content:center; cursor:pointer; transition: background .25s ease, transform .25s ease, opacity .25s ease; padding:0; }
.nm-nav-btn:hover{ transform:scale(1.06); }
.nm-nav-btn:disabled{ color:var(--nm-arrow-disabled); cursor:default; transform:none; opacity:.55; }
.nm-nav-btn svg{ width:14px; height:14px; display:block; }

.nm-slider{ position:relative; }
.nm-viewport{ overflow:hidden; width:100%; }

.nm-track{
  display:flex;
  gap:var(--nm-gap, 18px);
  min-height:530px;
  align-items:stretch;
  will-change: transform;
  touch-action: pan-y;
  transform: translate3d(0, 0, 0);
}

.nm-track.is-sliding{ transition: transform 0.6s cubic-bezier(0.19, 1, 0.22, 1); }

/* SLIDER MODE - карточки с анимацией ширины при ховере */
.nm-track:not(.is-grid) > .nm-card{
  flex: 0 0 auto;
  width: var(--nm-card-width, 33%);
  transition: width .55s cubic-bezier(.22,1,.36,1);
}
.nm-track:not(.is-grid) > .nm-card.is-active{
  width: var(--nm-card-width-active, var(--nm-card-width, 33%));
  z-index: 2;
}
.nm-track:not(.is-grid).has-active-card > .nm-card.nm-card-visible:not(.is-active){
  width: var(--nm-card-width-inactive, var(--nm-card-width, 33%));
}
/* Во время свайпа отключаем width transition, чтобы не было дёрганий */
.nm-track.is-dragging > .nm-card{ transition: none !important; }

/* GRID MODE - расширение через flex-grow */
.nm-track.is-grid > .nm-card{
  flex: 1 1 0;
  min-width: 0;
  transition: flex-grow .55s cubic-bezier(.22,1,.36,1);
}
.nm-track.is-grid > .nm-card.is-active{ flex-grow: 2.2; }

.nm-card{
  position:relative;
  min-width:0;
  border-radius:28px;
  overflow:hidden;
  cursor:pointer;
  background:#111;
  z-index: 1;
}

/* СЛОИ - Строгая изоляция градиента от картинки */
.nm-card-media { position: absolute; inset: 0; z-index: 1; background: #111; overflow: hidden; border-radius: 28px; transform: translateZ(0); }
.nm-card-overlay {
  position: absolute; inset: 0; z-index: 2; pointer-events: none;
  background: linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.1) 40%, rgba(0,0,0,0.75) 100%);
  transform: translateZ(0);
}
.nm-card::after { content: ""; position: absolute; inset: 0; border-radius: 28px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.08); pointer-events: none; z-index: 3; }

/* АНИМАЦИИ КАРТИНОК */
.nm-card-media img {
  width: 100%; height: 100%; object-fit: cover; display: block;
  transform: translateZ(0) scale(1.03);
  transition: filter 0.6s cubic-bezier(0.22,1,0.36,1), transform 0.6s cubic-bezier(0.22,1,0.36,1);
  pointer-events: none; user-select: none; -webkit-user-drag: none;
  will-change: filter, transform;
}

.nm-card:not(.nm-card-visible) img { filter: brightness(0.6) blur(6px); }
.nm-card.nm-card-visible:not(.is-active) img { filter: brightness(0.85) blur(0px); }
.nm-card.nm-card-visible.is-active img { filter: brightness(1) blur(0px); transform: scale(1.05) translateZ(0); }

.nm-track.is-dragging .nm-card:not(.nm-card-visible) img {
  filter: brightness(0.7) blur(var(--dynamic-blur, 6px));
  transition: none !important;
}

/* НИЖНИЙ ЛЕЙБЛ */
.nm-label {
  position: absolute; left: 18px; bottom: 18px;
  writing-mode: vertical-rl; transform: rotate(180deg);
  font-weight: 900; font-size: 24px; letter-spacing: -0.04em;
  white-space: nowrap; z-index: 4;
  opacity: 1;
  transition: opacity 0.3s ease, transform 0.3s ease;
}
.nm-card.is-active .nm-label { opacity: 0; transform: rotate(180deg) translateX(10px); }

/* ПОБУКВЕННАЯ АНИМАЦИЯ */
.nm-slashes {
  color: var(--nm-accent); font-size: 25px; margin-bottom: 4px;
  opacity: 0; transition: opacity 0.25s ease;
}
.nm-main-char {
  display: inline-block;
  opacity: 0;
  transform: translateY(15px);
  filter: blur(4px);
  transition: opacity 0.25s ease, transform 0.25s ease, filter 0.25s ease;
  transition-delay: 0s;
}
.nm-main-space { display: inline-block; inline-size: 0.25em; }

.nm-card.nm-card-settled .nm-slashes { opacity: 1; transition: opacity 0.5s ease; }
.nm-card.nm-card-settled .nm-main-char {
  opacity: 1;
  transform: translateY(0);
  filter: blur(0);
  transition-duration: 0.5s, 0.6s, 0.5s;
  transition-timing-function: ease, cubic-bezier(0.22,1,0.36,1), ease;
  transition-delay: var(--delay);
}

/* ВЕРХНИЙ ЛЕЙБЛ */
.nm-label-top{
  position:absolute; left:22px; top:22px; right:22px;
  font-weight:700; font-size:13px; letter-spacing:.1em; text-transform:uppercase;
  white-space:nowrap; overflow:hidden; z-index:4; pointer-events:none;
  display:flex; align-items:center; gap:0;
}
.nm-label-top .nm-lt-slash{
  color:var(--nm-accent); font-size:18px; font-weight:900;
  margin-right:8px; opacity:0; transform:translateY(5px) scaleY(0);
  transition: opacity .2s ease, transform .25s cubic-bezier(.22,1,.36,1);
}
.nm-label-top .nm-lt-char{
  display:inline-block; opacity:0; transform:translateY(10px); filter:blur(3px);
  transition: opacity .15s ease, transform .2s cubic-bezier(.22,1,.36,1), filter .15s ease;
}
.nm-label-top .nm-lt-space{ display:inline-block; width:.3em; }

.nm-card.is-active .nm-label-top .nm-lt-slash{ opacity:1; transform:translateY(0) scaleY(1); transition-delay:.06s; }
.nm-card.is-active .nm-label-top .nm-lt-char{ opacity:1; transform:translateY(0); filter:blur(0); }

@media (max-width:1200px){
  .nm-wrap{ padding:26px 20px 34px; }
  .nm-title{ font-size:48px; }
  .nm-head{ margin-bottom:22px; }
  .nm-track{ min-height:460px; }
  .nm-card, .nm-card::after, .nm-card-media{ border-radius:24px; }
  .nm-label{ left:14px; bottom:14px; font-size:22px; }
  .nm-label-top{ left:16px; top:16px; right:16px; }
}
@media (max-width:980px){
  .nm-title{ font-size:30px; }
  .nm-track{ min-height:360px; }
  .nm-label{ font-size:18px; }
  .nm-nav-btn{ width:34px; height:34px; }
  .nm-track.is-grid > .nm-card.is-active{ flex-grow:1.5; }
  .nm-label-top{ font-size:11px; left:14px; top:14px; right:14px; }
}
@media (max-width:760px){
  .nm-wrap{ padding:20px 16px 28px; }
  .nm-head{ align-items:center; margin-bottom:16px; }
  .nm-title{ font-size:20px; }
  .nm-track{ min-height:0; }
  .nm-card, .nm-card-media{ min-height:280px; border-radius:22px; }
  .nm-card::after{ border-radius:22px; }
  .nm-label{ writing-mode:horizontal-tb; transform:none; left:14px; bottom:14px; font-size:19px; max-width:calc(100% - 28px); white-space:normal; line-height:.95; }
  .nm-card.is-active .nm-label{ opacity:0; transform:translateX(-6px); }
  .nm-label-top{ left:14px; top:14px; right:14px; font-size:11px; }
  .nm-nav{ gap:6px; }
  .nm-nav-btn{ width:30px; height:30px; }
}
</style>

<script>
(function(){
var CASES = [];
var SETTINGS = { desktopLimit: 3, desktopVisible: 3, tabletVisible: 4, mobileVisible: 1 };
var PRELOAD_AHEAD = 2;
/* Насколько шире становится активная карточка (25%).
   Соседи равномерно делят эту дельту между собой — общая ширина окна не меняется. */
var ACTIVE_GROWTH = 0.5;

var root = document.getElementById("nm-directions");
var preloadedUrls = {};

root.innerHTML =
  '<div class="nm-wrap">' +
    '<div class="nm-head">' +
      '<h2 class="nm-title">БРЕНД-ВИДЕО</h2>' +
      '<div class="nm-nav" id="nm-nav">' +
        '<button class="nm-nav-btn" id="nm-prev" type="button" aria-label="Назад">' +
          '<svg viewBox="0 0 24 24" fill="none"><path d="M14.5 6L8.5 12L14.5 18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>' +
        '</button>' +
        '<button class="nm-nav-btn" id="nm-next" type="button" aria-label="Вперёд">' +
          '<svg viewBox="0 0 24 24" fill="none"><path d="M9.5 6L15.5 12L9.5 18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>' +
        '</button>' +
      '</div>' +
    '</div>' +
    '<div class="nm-slider"><div class="nm-viewport"><div class="nm-track" id="nm-track"></div></div></div>' +
  '</div>';

var nav = root.querySelector("#nm-nav");
var prevBtn = root.querySelector("#nm-prev");
var nextBtn = root.querySelector("#nm-next");
var track = root.querySelector("#nm-track");
var viewport = root.querySelector(".nm-viewport");

var startIndex = 0;
var visibleCount = SETTINGS.desktopVisible;
var useSlider = false;
var activeCardId = null;
var cardStep = 0;
var blockVisible = false;
var lastSwipeTime = 0;
var currentCardsTimer = null;

function getGapNum(){
  var w = window.innerWidth;
  if (w <= 760) return 10;
  if (w <= 1200) return 14;
  return 18;
}
function getVisibleCount(){
  var w = window.innerWidth;
  if (w <= 760) return SETTINGS.mobileVisible;
  if (w <= 980) return SETTINGS.tabletVisible;
  return SETTINGS.desktopVisible;
}
function shouldUseSlider(){
  var w = window.innerWidth;
  if (w <= 760) return CASES.length > SETTINGS.mobileVisible;
  if (w <= 980) return CASES.length > SETTINGS.tabletVisible;
  return CASES.length > SETTINGS.desktopLimit;
}
function getMaxStartIndex(){ return Math.max(0, CASES.length - visibleCount); }

function canUseHover(){
  return window.matchMedia("(hover:hover) and (pointer:fine)").matches && window.innerWidth > 980;
}

function updateNav(){
  if (!useSlider) { nav.classList.remove("is-visible"); prevBtn.disabled = true; nextBtn.disabled = true; return; }
  nav.classList.add("is-visible");
  prevBtn.disabled = startIndex <= 0;
  nextBtn.disabled = startIndex >= getMaxStartIndex();
}

function smartPreload(){
  var from = Math.max(0, startIndex - PRELOAD_AHEAD);
  var to = Math.min(CASES.length, startIndex + visibleCount + PRELOAD_AHEAD);
  for (var i = from; i < to; i++) {
    var url = CASES[i] && CASES[i].preview;
    if (url && !preloadedUrls[url]) {
      preloadedUrls[url] = true;
      var img = new Image();
      img.src = url;
    }
  }
}

function makeLetterSpans(text) {
  var html = '';
  for (var i = 0; i < text.length; i++) {
    var ch = text[i];
    if (ch === ' ') html += '<span class="nm-lt-char nm-lt-space" style="transition-delay:' + (i * 20) + 'ms"></span>';
    else html += '<span class="nm-lt-char" style="transition-delay:' + (i * 20) + 'ms">' + ch + '</span>';
  }
  return html;
}

function makeMainLetterSpans(text) {
  var html = '';
  for (var i = 0; i < text.length; i++) {
    var ch = text[i];
    if (ch === ' ') html += '<span class="nm-main-char nm-main-space" style="--delay:' + (i * 15) + 'ms"></span>';
    else html += '<span class="nm-main-char" style="--delay:' + (i * 15) + 'ms">' + ch + '</span>';
  }
  return html;
}

function getTopLabelText(item) {
  if (item.tags && item.tags.length) return item.tags.join(' / ');
  if (item.categories && item.categories.length) return item.categories.join(' / ');
  return item.title;
}

function makeCardHTML(item){
  var topText = getTopLabelText(item);
  return '<div class="nm-card" data-id="' + item.id + '">'
    + '<div class="nm-card-media">'
    + '<img src="' + item.preview + '" alt="' + item.title + '" loading="lazy" draggable="false"'
    + ' onerror="this.style.opacity=\'0\';">'
    + '</div>'
    + '<div class="nm-card-overlay"></div>'
    + '<div class="nm-label"><span class="nm-slashes">|</span>' + makeMainLetterSpans(item.title) + '</div>'
    + '<div class="nm-label-top"><span class="nm-lt-slash">|</span>' + makeLetterSpans(topText) + '</div>'
    + '</div>';
}

function updateCurrentCards() {
  var cards = track.querySelectorAll('.nm-card');
  cards.forEach(function(c, i) {
    if (i >= startIndex && i < startIndex + visibleCount) {
      c.classList.add('nm-card-visible');
    } else {
      c.classList.remove('nm-card-visible');
      c.classList.remove('nm-card-settled'); 
    }
  });
  
  clearTimeout(currentCardsTimer);
  currentCardsTimer = setTimeout(function() {
    cards.forEach(function(c, i) {
      if (i >= startIndex && i < startIndex + visibleCount) {
        c.classList.add('nm-card-settled');
      }
    });
  }, 600);
}

function bindCardEvents(){
  var cards = track.querySelectorAll(".nm-card");
  cards.forEach(function(card){
    card.addEventListener("mouseenter", function(){
      if (!canUseHover()) return;
      activeCardId = card.dataset.id;
      setActiveCard();
    });
    card.addEventListener("click", function(){
      if (Date.now() - lastSwipeTime < 350) return;
      window.location.href = "/case?type=brands&id=" + card.dataset.id;
    });
  });
  track.onmouseleave = function(){
    if (!canUseHover()) return;
    activeCardId = null;
    setActiveCard();
  };
}

function setActiveCard(){
  track.querySelectorAll(".nm-card").forEach(function(c){
    c.classList.toggle("is-active", activeCardId === c.dataset.id);
  });
  /* Класс на треке: нужен, чтобы соседи ужимались ТОЛЬКО когда есть активная карточка */
  track.classList.toggle("has-active-card", !!activeCardId);
}

function calculateCardStep(){
  if (!useSlider) { cardStep = 0; return; }
  var vpWidth = viewport.clientWidth;
  var gap = getGapNum();
  var cardWidth = (vpWidth - gap * (visibleCount - 1)) / visibleCount;

  /* Активная карточка растёт на ACTIVE_GROWTH (25%),
     каждый из (visibleCount - 1) видимых соседей ужимается на ACTIVE_GROWTH / (visibleCount - 1).
     Сумма ширин в видимом окне неизменна → cardStep и translateX остаются валидными. */
  var inactiveShrink = visibleCount > 1 ? ACTIVE_GROWTH / (visibleCount - 1) : 0;
  var activeW   = cardWidth * (1 + ACTIVE_GROWTH);
  var inactiveW = cardWidth * (1 - inactiveShrink);

  root.style.setProperty('--nm-card-width', cardWidth + 'px');
  root.style.setProperty('--nm-card-width-active', activeW + 'px');
  root.style.setProperty('--nm-card-width-inactive', inactiveW + 'px');
  root.style.setProperty('--nm-gap', gap + 'px');
  cardStep = cardWidth + gap;
}

function applyTransform(animated){
  if (!useSlider) {
    track.style.transform = '';
    track.classList.remove('is-sliding');
    return;
  }
  if (animated) track.classList.add('is-sliding');
  else track.classList.remove('is-sliding');
  var x = -startIndex * cardStep;
  track.style.transform = 'translate3d(' + x + 'px, 0, 0)';
}

function renderCards(){
  activeCardId = null;
  track.classList.remove('has-active-card');
  track.classList.toggle('is-grid', !useSlider);
  track.innerHTML = CASES.map(makeCardHTML).join('');
  bindCardEvents();
  if (useSlider) {
    calculateCardStep();
    applyTransform(false);
  } else {
    track.style.transform = '';
  }
  updateNav();
  smartPreload();
  updateCurrentCards();
}

function updateMode(){
  var newVisibleCount = getVisibleCount();
  var newUseSlider = shouldUseSlider();
  
  if (newVisibleCount !== visibleCount || newUseSlider !== useSlider) {
    visibleCount = newVisibleCount;
    useSlider = newUseSlider;
    startIndex = Math.min(startIndex, getMaxStartIndex());
    renderCards();
  } else {
    startIndex = Math.min(startIndex, getMaxStartIndex());
    calculateCardStep();
    applyTransform(false);
    updateCurrentCards();
  }
}

prevBtn.addEventListener("click", function(){
  if (!useSlider || startIndex <= 0) return;
  startIndex -= 1;
  applyTransform(true);
  updateNav();
  smartPreload();
  updateCurrentCards();
});
nextBtn.addEventListener("click", function(){
  if (!useSlider || startIndex >= getMaxStartIndex()) return;
  startIndex += 1;
  applyTransform(true);
  updateNav();
  smartPreload();
  updateCurrentCards();
});

/* ========== TOUCH / SWIPE ========== */
var touchStartX = 0, touchStartY = 0, touchMode = null, touchCurrentDx = 0;
var activeTouchId = null;
var DIRECTION_THRESHOLD = 8;
var SWAP_THRESHOLD_RATIO = 0.2;
var EDGE_RESISTANCE = 0.3;

track.addEventListener('touchstart', function(e){
  if (!useSlider) return;
  if (activeTouchId !== null) return;

  var touch = e.changedTouches[0];
  activeTouchId = touch.identifier;

  touchStartX = touch.clientX;
  touchStartY = touch.clientY;
  touchMode = null;
  touchCurrentDx = 0;

  track.classList.remove('is-sliding');
}, { passive: true });

track.addEventListener('touchmove', function(e){
  if (!useSlider) return;

  var touch = null;
  for (var i = 0; i < e.changedTouches.length; i++) {
    if (e.changedTouches[i].identifier === activeTouchId) {
      touch = e.changedTouches[i];
      break;
    }
  }
  if (!touch) return;

  var dx = touch.clientX - touchStartX;
  var dy = touch.clientY - touchStartY;

  if (touchMode === null) {
    if (Math.abs(dx) < DIRECTION_THRESHOLD && Math.abs(dy) < DIRECTION_THRESHOLD) return;
    touchMode = Math.abs(dx) > Math.abs(dy) ? 'horizontal' : 'vertical';
    if (touchMode === 'vertical') return;
  }

  if (touchMode !== 'horizontal') return;
  if (e.cancelable) e.preventDefault();

  track.classList.add('is-dragging');

  var eff = dx;
  if ((startIndex <= 0 && dx > 0) || (startIndex >= getMaxStartIndex() && dx < 0)) {
    eff = dx * EDGE_RESISTANCE;
  }
  touchCurrentDx = eff;
  track.style.transform = 'translate3d(' + (-startIndex * cardStep + eff) + 'px, 0, 0)';

  var ratio = Math.min(Math.abs(eff) / cardStep, 1);
  var blurVal = 6 * (1 - ratio);
  root.style.setProperty('--dynamic-blur', blurVal + 'px');
}, { passive: false });

function handleTouchEnd(e) {
  if (!useSlider || activeTouchId === null) return;

  var touch = null;
  for (var i = 0; i < e.changedTouches.length; i++) {
    if (e.changedTouches[i].identifier === activeTouchId) {
      touch = e.changedTouches[i];
      break;
    }
  }
  if (!touch) return;

  activeTouchId = null;
  track.classList.remove('is-dragging');

  if (touchMode !== 'horizontal') { touchMode = null; return; }
  touchMode = null;
  lastSwipeTime = Date.now();

  var dx = touchCurrentDx;
  var threshold = cardStep * SWAP_THRESHOLD_RATIO;
  if (dx <= -threshold && startIndex < getMaxStartIndex()) startIndex += 1;
  else if (dx >= threshold && startIndex > 0) startIndex -= 1;

  applyTransform(true);
  updateNav();
  smartPreload();
  updateCurrentCards();
}

track.addEventListener('touchend', handleTouchEnd, { passive: true });
track.addEventListener('touchcancel', handleTouchEnd, { passive: true });

/* ========== RESIZE ========== */
var resizeTimer = null;
window.addEventListener("resize", function(){
  if (resizeTimer) clearTimeout(resizeTimer);
  resizeTimer = setTimeout(updateMode, 150);
});

/* ========== INTERSECTION OBSERVER ========== */
function initObserver(){
  if (!('IntersectionObserver' in window)) { blockVisible = true; return; }
  var observer = new IntersectionObserver(function(entries){
    entries.forEach(function(entry){
      if (entry.isIntersecting && !blockVisible) {
        blockVisible = true;
        if (CASES.length) updateMode();
        observer.unobserve(root);
      }
    });
  }, { rootMargin: '200px' });
  observer.observe(root);
}

document.addEventListener("DOMContentLoaded", function(){
  fetch("https://s3.ru1.storage.beget.cloud/ace65a9fae78-nmediafiles/brands.json")
    .then(function(r){ return r.json(); })
    .then(function(data){
      CASES = data;
      if (blockVisible) updateMode();
    })
    .catch(function(err){ console.error("nm-directions: failed to load cases", err); });
  initObserver();
});
})();
</script>
